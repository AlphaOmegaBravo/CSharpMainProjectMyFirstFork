<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8584a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Пекарня-мёрдж</title>
<style>
:root{--ink:#3d2412;--cream:#fff8ec;--font:"Nunito","Varela Round","Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e9a868;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:var(--font);color:var(--ink);-webkit-text-size-adjust:100%}
#app{position:absolute;left:50%;top:0;width:100%;height:100%;transform:translateX(-50%);overflow:hidden;background:#f6c48a}
canvas{display:block}
#bg,#cv,#fx{position:absolute;left:0;top:0}
#cv{touch-action:none}
#fx{pointer-events:none;z-index:20}
.hidden{display:none!important}
svg{display:block}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:.35em;padding:calc(env(safe-area-inset-top,0px) + .45em) .5em .3em;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;height:2.35em;background:var(--cream);border:.16em solid var(--ink);border-radius:1.2em;box-shadow:0 .18em 0 var(--ink);padding:0 .6em 0 .15em;font-weight:900;white-space:nowrap;position:relative;min-width:0}
.pill i svg{width:1.85em;height:1.85em}
.pill i{flex:none;margin-right:.2em;margin-left:-.05em}
#pEnergy{flex:1.25}
#pCoins{flex:1}
.pnum{display:flex;flex-direction:column;line-height:1;min-width:0}
.pnum b{font-size:1.02em}
.pnum small{font-size:.62em;font-weight:800;opacity:.75;margin-top:.1em}
#pLevel{flex:none;width:2.55em;height:2.55em;border-radius:50%;border:.16em solid var(--ink);box-shadow:0 .18em 0 var(--ink);background:conic-gradient(#5cc43c var(--xp,0%),#eadccb 0);padding:.2em;cursor:pointer}
.lvin{width:100%;height:100%;border-radius:50%;background:var(--cream);position:relative;display:flex;align-items:center;justify-content:center}
.lvin svg{width:1.6em;height:1.6em}
.lvin b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.68em;font-weight:900;padding-top:.15em}
.pnum{overflow:hidden}
.rbtn{flex:none;width:2.35em;height:2.35em;border-radius:50%;border:.16em solid var(--ink);background:var(--cream);box-shadow:0 .18em 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;touch-action:manipulation}
.rbtn svg{width:1.4em;height:1.4em}
.rbtn:active,.btn:active{transform:translateY(.14em);box-shadow:0 .06em 0 var(--ink)}

/* Bottom */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:.25em .5em calc(env(safe-area-inset-bottom,0px) + .5em);pointer-events:none}
#bottom>*{pointer-events:auto}
#info{display:flex;align-items:center;gap:.45em;height:3.15em;background:rgba(255,248,236,.97);border:.16em solid var(--ink);border-radius:.9em;padding:0 .35em;margin-bottom:.45em;box-shadow:0 .16em 0 var(--ink)}
#infoIcon{width:2.55em;height:2.55em;flex:none}
#infoText{flex:1;min-width:0;line-height:1.15;display:flex;flex-direction:column;justify-content:center}
#infoName{font-weight:900;font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#infoDesc{font-size:.72em;font-weight:700;opacity:.8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#bar{display:flex;gap:.4em}
.btn{font-family:inherit;font-weight:900;font-size:.95em;color:#fff;border:.16em solid var(--ink);border-radius:.85em;box-shadow:0 .22em 0 var(--ink);background:#6cc04a;padding:0 .55em;height:2.95em;display:flex;align-items:center;justify-content:center;gap:.25em;cursor:pointer;position:relative;text-shadow:0 .1em 0 rgba(0,0,0,.35);touch-action:manipulation;transition:transform .06s;white-space:nowrap;line-height:1}
.btn i svg{width:1.55em;height:1.55em}
.btn>svg{width:1.3em;height:1.3em;flex:none}
.btn.small{height:2.3em;font-size:.8em;padding:0 .55em;flex:none;box-shadow:0 .16em 0 var(--ink)}
.btn.small i svg{width:1.3em;height:1.3em}
#bar .btn{flex:1;min-width:0}
#bar .btn.sq{flex:none;width:2.95em;padding:0;background:var(--cream)}
.green{background:#6cc04a}.yellow{background:#ffae1f}.blue{background:#4c9fe0}.pink{background:#ff7aa2}.gray{background:#b5a393}.red{background:#e8584a}.cream{background:var(--cream);color:var(--ink);text-shadow:none}
.adb{position:absolute;top:-.6em;right:-.3em;display:flex;align-items:center;gap:.1em;background:#e8584a;border:.12em solid var(--ink);border-radius:.55em;font-size:.6em;font-style:normal;padding:.12em .35em .1em .25em;line-height:1;color:#fff}
.adb svg{width:.9em;height:.9em}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-.3em)}40%{transform:translateX(.3em)}60%{transform:translateX(-.2em)}80%{transform:translateX(.2em)}}

.dot{position:absolute;top:-.35em;right:-.35em;width:.85em;height:.85em;border-radius:50%;background:#e8453c;border:.12em solid var(--ink);box-shadow:0 0 0 .1em #fff}
.rbtn.gift{position:relative;background:#ffe27a;animation:pulse 1s ease-in-out infinite}
.rbtn.gift svg{width:1.55em;height:1.55em}
.small{font-size:.8em;opacity:.8}
.tabs{display:flex;gap:.4em;margin:-.2em 0 .6em}
.tab{flex:1;font:inherit;font-weight:900;font-size:.9em;border:.14em solid var(--ink);border-radius:.7em;background:#f1dfc6;color:var(--ink);height:2.4em;position:relative;cursor:pointer;touch-action:manipulation}
.tab.on{background:#ffae1f;color:#fff;text-shadow:0 .1em 0 rgba(0,0,0,.3);box-shadow:0 .14em 0 var(--ink)}
.urow.locked{background:#f3ece4}
.urow.locked .uic,.urow.locked .utext{opacity:.55}
.bsec{border:.13em solid var(--ink);border-radius:.85em;background:#fff;padding:.5em .5em .55em;margin-bottom:.6em}
.bsec.locked{background:#f3ece4}
.bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.35em}
.bhead span{font-weight:900;font-size:.85em;background:#f1dfc6;border-radius:.6em;padding:.05em .5em}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.25em .2em}
.bcell{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:.64em;line-height:1.1;font-weight:800;min-height:5.4em}
.bcell canvas{width:3.6em;height:3.6em}
.bcell.unk canvas{filter:brightness(0) opacity(.2)}
.bcell.unk span{opacity:.5}
.bfoot{margin-top:.4em;font-size:.8em;text-align:center;display:flex;justify-content:center}
.bfoot .btn{height:2.3em;font-size:.95em}
.bfoot .btn i svg{width:1.3em;height:1.3em}
.bbar{width:100%;height:.7em;border:.12em solid var(--ink);border-radius:.4em;background:#f1dfc6;overflow:hidden}
.bbar i{display:block;height:100%;background:linear-gradient(#ffd75a,#f0a81a)}
.okmark{display:flex;align-items:center;gap:.3em;font-weight:900;color:#3f8f2a}
.okmark svg{width:1.3em;height:1.3em}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4em}
.dcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;border:.13em solid var(--ink);border-radius:.7em;background:#fff;padding:.3em .1em;min-height:5.2em}
.dcard small{font-size:.66em;font-weight:900;opacity:.75}
.dcard i{display:flex}
.dcard i svg{width:1.9em;height:1.9em}
.dcard b{font-size:.8em}
.dcard.big{grid-column:span 2;background:#fff6d0}
.dcard.past{opacity:.55}
.dcard.today{background:#ffe27a;box-shadow:0 0 0 .18em #ffae1f;animation:pulse 1s ease-in-out infinite}
.dcard em{position:absolute;top:-.4em;right:-.3em}
.dcard em svg{width:1.4em;height:1.4em}
#tip{position:absolute;left:50%;z-index:12;transform:translateX(-50%);max-width:86%;background:#fff;border:.16em solid var(--ink);border-radius:1em;box-shadow:0 .2em 0 var(--ink);padding:.55em 1em;font-weight:900;text-align:center;pointer-events:none;animation:tipb 1.4s ease-in-out infinite;line-height:1.2}
@keyframes tipb{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-.25em)}}

.btn.small.sq{width:2.3em;padding:0}
.btn.small i svg{width:1.3em;height:1.3em}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.4em;margin:.2em 0 .5em}
.sslot{aspect-ratio:1;border:.13em dashed rgba(61,36,18,.35);border-radius:.7em;background:#fff;display:flex;align-items:center;justify-content:center}
.sslot.full{border-style:solid;border-color:var(--ink);cursor:pointer;background:#fff7e6}
.sslot.full:active{transform:scale(.93)}
.sslot canvas{width:88%;height:88%}
.sslot.locked{background:#eadccb;border-style:solid;border-color:rgba(61,36,18,.25)}
.sslot.locked svg{width:45%;height:45%;opacity:.6}
.qrow{display:flex;align-items:center;gap:.55em;padding:.45em .5em;border:.13em solid var(--ink);border-radius:.85em;background:#fff;margin-bottom:.5em}
.qrow.done{background:#eef8e6}
.qrow .utext small{margin-top:.15em}
.qrow .bbar{margin-top:.3em}
.qright{flex:none;display:flex;align-items:center;justify-content:center;min-width:4.6em}
.qright>svg{width:2em;height:2em}
.qrw{display:flex;flex-direction:column;align-items:flex-end;font-weight:900;font-size:.85em;gap:.1em}
.qrw span{display:flex;align-items:center;gap:.1em}
.qrw svg{width:1.3em;height:1.3em}
.news{background:#fff6d0;border:.12em solid var(--ink);border-radius:.7em;padding:.4em .6em;margin:.4em 0;text-align:center;font-weight:900}

.urow.prest{background:linear-gradient(#fff6fa,#ffe6ef);border-width:.16em}
.swatch{width:100%;height:100%;border-radius:.6em;border:.13em solid var(--ink)}
.strong{font-weight:900;opacity:1!important;color:#c2410c}
.btn.swb{width:2.4em;min-width:0;height:2.1em;padding:0}
.btn.swb.on{box-shadow:0 0 0 .18em #fff,0 0 0 .32em var(--ink)}

.wheel{display:block;margin:.2em auto .6em}
.wbtn{margin:0 auto .3em;min-width:12em;height:2.8em}
.wbtn i svg{width:1.3em;height:1.3em}
.tabs .tab{font-size:.82em}

/* Toast */
#toast{position:absolute;left:50%;top:30%;z-index:25;transform:translate(-50%,0) scale(.9);background:rgba(61,36,18,.93);color:#fff;font-weight:800;padding:.55em 1.1em;border-radius:1.2em;font-size:.9em;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;max-width:88%;text-align:center;line-height:1.25}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* Modal */
#modal{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(40,20,8,.55);padding:1em}
.mcard{width:100%;max-width:23em;max-height:94%;display:flex;flex-direction:column;background:var(--cream);border:.2em solid var(--ink);border-radius:1.2em;box-shadow:0 .35em 0 var(--ink);animation:mpop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes mpop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.mtitle{background:#e8584a;color:#fff;font-weight:900;font-size:1.25em;text-align:center;padding:.45em .6em .5em;border-bottom:.16em solid var(--ink);border-radius:1em 1em 0 0;text-shadow:0 .1em 0 rgba(0,0,0,.3)}
.mbody{padding:.8em .85em;overflow:auto;font-weight:700;line-height:1.38;font-size:.95em;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.mbody p{margin:.2em 0 .6em}
.mbtns{display:flex;gap:.5em;padding:.1em .85em .95em}
.mbtns .btn{flex:1}
.center{text-align:center}
.bigicon{display:flex;justify-content:center;margin:.1em 0 .5em}
.bigicon canvas,.bigicon svg{width:5.5em;height:5.5em}
.rew{display:flex;justify-content:center;align-items:center;gap:.7em;font-size:1.25em;font-weight:900;margin:.4em 0}
.rew span{display:flex;align-items:center;gap:.15em}
.rew svg{width:1.4em;height:1.4em}
.urow{display:flex;align-items:center;gap:.55em;padding:.45em .5em;border:.13em solid var(--ink);border-radius:.85em;background:#fff;margin-bottom:.5em}
.uic{width:2.9em;height:2.9em;flex:none;display:flex;align-items:center;justify-content:center}
.uic canvas,.uic svg{width:100%;height:100%}
.utext{flex:1;min-width:0;line-height:1.2}
.utext b{display:block;font-size:.95em}
.utext small{display:block;font-size:.74em;opacity:.78;margin-top:.1em}
.pips{display:flex;gap:.22em;margin-top:.3em}
.pips i{width:.62em;height:.62em;border-radius:50%;border:.11em solid var(--ink);background:#eadccb}
.pips i.on{background:#ffcc3e}
.ubuy{min-width:4.8em;height:2.45em;font-size:.85em;flex:none}
.ubuy i svg{width:1.3em;height:1.3em}
.ubuy.no{filter:grayscale(.65) brightness(.97)}
.ubuy.done{background:#cbbcad}
.chainprev{display:flex;gap:.05em;margin-top:.3em;flex-wrap:wrap}
.chainprev canvas{width:1.4em;height:1.4em}
.srow{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.45em 0;border-bottom:.1em dashed rgba(61,36,18,.25)}
.srow:last-child{border-bottom:0}
.seg{display:flex;gap:.3em}
.seg .btn{height:2.3em;font-size:.8em;min-width:3.6em}
.ver{font-size:.72em;opacity:.6;text-align:center;margin-top:.6em}

/* Ad stub */
#ad{position:absolute;inset:0;z-index:40;background:rgba(15,10,30,.94);display:flex;align-items:center;justify-content:center;color:#fff;padding:1.2em}
.adbox{width:100%;max-width:20em;text-align:center}
.adtag{display:inline-block;background:#ffcc3e;color:var(--ink);font-weight:900;border-radius:.4em;padding:.1em .5em;font-size:.8em}
.adtitle{font-size:1.3em;font-weight:900;margin:.5em 0 .3em}
.adtext{font-size:.85em;opacity:.8;margin-bottom:1em;font-weight:700}
.adscreen{height:9em;border-radius:1em;border:.15em solid rgba(255,255,255,.3);background:linear-gradient(135deg,#5b3cc4,#e8584a);display:flex;align-items:center;justify-content:center;font-size:2.4em;font-weight:900;letter-spacing:.05em;margin-bottom:.9em}
.adbar{height:.6em;border-radius:.3em;background:rgba(255,255,255,.2);overflow:hidden;margin-bottom:.6em}
.adbar i{display:block;height:100%;width:0;background:#ffcc3e}
#adCount{font-weight:800;font-size:.9em;margin-bottom:.9em;min-height:1.2em}
#adClose{margin:0 auto;min-width:10em}

/* Loader */
#loader{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#ffe2b8,#f4b77c);transition:opacity .45s}
#loader.fade{opacity:0;pointer-events:none}
#loader h1{font-size:2.1em;margin:.3em .5em;color:#fff;text-align:center;line-height:1.1;text-shadow:.07em .07em 0 var(--ink),-.07em .07em 0 var(--ink),.07em -.07em 0 var(--ink),-.07em -.07em 0 var(--ink),0 .16em 0 var(--ink)}
#loader canvas{width:7em;height:7em;animation:bob 1s ease-in-out infinite}
#loader p{font-weight:800;opacity:.75}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-.5em) scale(.97,1.03)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="pill" id="pEnergy"><i data-icon="bolt"></i><div class="pnum"><b id="energyTxt">0/0</b><small id="energyTimer"></small></div></div>
    <div class="pill" id="pCoins"><i data-icon="coin"></i><div class="pnum"><b id="coinsTxt">0</b></div></div>
    <div id="pLevel"><div class="lvin"><span data-icon="star"></span><b id="lvlTxt">1</b></div></div>
    <button class="rbtn gift hidden" id="btnGift" aria-label="gift"><span data-icon="gift"></span><i class="dot"></i></button>
    <button class="rbtn" id="btnSound" aria-label="sound"></button>
    <button class="rbtn" id="btnSettings" aria-label="settings"><span data-icon="gear"></span></button>
  </div>
  <div id="bottom">
    <div id="info"><canvas id="infoIcon"></canvas><div id="infoText"><b id="infoName"></b><span id="infoDesc"></span></div><button class="btn small cream hidden" id="ib1"></button><button class="btn small yellow hidden" id="ib2"></button></div>
    <div id="bar">
      <button class="btn green" id="btnShop"><i data-icon="shop"></i><span data-i18n="shop"></span><i class="dot hidden" id="shopDot"></i></button>
      <button class="btn yellow" id="btnEnergyAd"><i data-icon="bolt"></i><span id="energyAdTxt">+20</span><em class="adb"><span data-icon="play"></span>AD</em></button>
      <button class="btn blue" id="btnClearAd"><i data-icon="box"></i><span data-i18n="clear"></span><em class="adb"><span data-icon="play"></span>AD</em></button>
      <button class="btn sq" id="btnQuests" aria-label="tasks"><i data-icon="quests"></i><i class="dot hidden" id="questDot"></i></button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="tip" class="hidden"></div>
  <canvas id="fx"></canvas>
  <div id="modal" class="hidden"><div class="mcard"><div class="mtitle" id="mTitle"></div><div class="mbody" id="mBody"></div><div class="mbtns" id="mBtns"></div></div></div>
  <div id="ad" class="hidden"><div class="adbox"><span class="adtag">AD</span><div class="adtitle" id="adTitle"></div><div class="adtext" id="adText"></div><div class="adscreen">DEMO</div><div class="adbar"><i id="adFill"></i></div><div id="adCount"></div><button class="btn yellow" id="adClose"></button></div></div>
  <div id="loader"><canvas id="loaderIcon" width="160" height="160"></canvas><h1 id="loaderTitle">Пекарня-мёрдж</h1><p id="loaderText">Загрузка…</p></div>
</div>
<script>
(function(){
'use strict';

/* =====================================================================
   1. CONFIG
   ===================================================================== */
const VERSION = '0.6';
const COLS = 7, ROWS = 9, N = COLS * ROWS;
const OUT = '#3d2412';
const FONT = '"Nunito","Varela Round","Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const CHAINS = {
  bread: { max: 8, color: '#f5b440', gen: [3, 3] },
  cake:  { max: 8, color: '#ff8fb1', gen: [3, 1] },
  fruit: { max: 8, color: '#e8453c', gen: [3, 5] },
  coffee: { max: 8, color: '#9a6235', gen: [1, 3] },
  ice: { max: 8, color: '#8fd8ff', gen: [1, 1] },
};
const CHAIN_IDS = ['bread', 'cake', 'fruit', 'coffee', 'ice'];
const BASE_ENERGY = 40;
const REGEN_SEC = [30, 26, 22, 18, 15, 12];
const LUCK_BASE = 5, LUCK_STEP = 6;
const AD_ENERGY = 20;
const UPG = [
  { id: 'cap',   cost: [60, 150, 300, 550, 900] },
  { id: 'regen', cost: [80, 180, 350, 600, 1000] },
  { id: 'luck',  cost: [100, 250, 500, 900] },
  { id: 'store', cost: [120, 350, 800] },
  { id: 'cake',   cost: [80],  chain: true },
  { id: 'fruit',  cost: [250], chain: true, minLvl: 3 },
  { id: 'coffee', cost: [600], chain: true, minLvl: 5 },
  { id: 'ice',    cost: [1500], chain: true, minLvl: 8 },
];
const HINT_DELAY = 6500;
const TUT_DONE = 9;
// 7-day login calendar; s = coins, e = energy, i = random level-3 item
const DAILY = [{ c: 20 }, { e: 15 }, { c: 40 }, { i: 3 }, { e: 25 }, { c: 80 }, { c: 120, e: 30 }];
const BOOK_REWARD = 100;
const STORE_BASE = 4, STORE_STEP = 2;
const BUBBLE_CHANCE = 0.08, BUBBLE_MS = 90000;
const VIP_CHANCE = 0.12, VIP_MS = 240000, VIP_MULT = 3;
const COMBO_MS = 2500, COMBO_MAX_BONUS = 5;
const SKIP_MS = 3 * 60000;   // an unfinished order can be swapped after this time
const PRESTIGE_LVL = 10, PRESTIGE_BONUS = 0.25;
// wheel of fortune: 1 free spin a day + WHEEL_ADS spins for rewarded ads; w = weight
const WHEEL = [{ c: 20, w: 20 }, { e: 10, w: 18 }, { c: 50, w: 12 }, { e: 20, w: 10 }, { c: 120, w: 4 }, { i: 3, w: 12 }, { e: 35, w: 5 }, { c: 30, w: 19 }];
const WHEEL_ADS = 3;
const OFFLINE_MIN_MS = 30 * 60000, OFFLINE_CAP_H = 8;
// bakery locations (prestige): wall gradient, wallpaper, awning stripes, tiles, frame, counter, page bg, pattern shape

   ===================================================================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const popScale = k => 1 - 0.45 * Math.cos(3 * Math.PI * k) * Math.exp(-5 * k);
const $ = id => document.getElementById(id);
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 10000 ? Math.floor(n / 1000) + 'K' : String(n);
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

}

/* =====================================================================
   13. ACTIONS

}

/* ---------- Daily quests ---------- */

function computeHint() {

    const sx = 1 + sq * 0.8 - idle, sy = 1 - sq + idle, s = size * 0.92;
    g.drawImage(SPR.get('g:cake'), x - s * sx / 2, y + s / 2 - s * sy, s * sx, s * sy);
  } else if (it.c === 'fruit' || it.c === 'ice') {

    const s = size * 0.92;

  } else {

  if (G.energy < 1) {

    for (let k = 0; k < 2; k++) {

function drawBoard(now, dt) {
  const g = ctx, cs = L.cs;
  // hints
  if (!press && now - lastInput > HINT_DELAY && G.tu >= TUT_DONE) {
    if (hintDirty) computeHint();
    if (hint && hint.cells) {
      const a = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(now * 0.006));
      g.globalAlpha = a;

      g.globalAlpha = 1;
    }
  }
  if (focus) {
    if (now > focus.until) focus = null;
    else {
      g.globalAlpha = 0.45 + 0.45 * Math.abs(Math.sin(now * 0.007));

      g.globalAlpha = 1;
    }
  }

  const dragIt = dragging ? board[press.i] : null;

    g.globalAlpha = 1;
  }
  // selection
  if (selected >= 0 && board[selected] && !dragging) {
    const p = cellCenter(selected), pad = 1 + Math.sin(now * 0.008) * 1.2;
    rr(g, p.x - cs / 2 + 1 - pad, p.y - cs / 2 + 1 - pad, cs - 2 + pad * 2, cs - 2 + pad * 2, cs * 0.2);
    g.lineWidth = 3.5; g.strokeStyle = '#fff'; g.stroke(); g.lineWidth = 1.5; g.strokeStyle = '#ffae1f'; g.stroke();
  }
  // drag target
  let tgt = -1;

    tgt = cellAt(press.x, press.y - cs * 0.25);

      const merge = b && dragIt && b.k === 'i' && dragIt.k === 'i' && b.c === dragIt.c && b.l === dragIt.l && b.l < CHAINS[b.c].max;

    let x = c.x, y = c.y, s = 1;
    if (it._ft) {

      else { const e = easeOutCubic(k); x = lerp(it._fx, c.x, e); y = lerp(it._fy, c.y, e) - Math.sin(k * Math.PI) * cs * 0.6 * (it._arc || 0); s = it._arc ? 0.5 + 0.5 * e : 1; }

    if (it.k === 'x') drawImg(SPR.get('x:' + it.hp), x, y, cs * s);
    else if (it.k === 'g') drawGen(it, x, y, cs * s, now, dt);
    else if (it.k === 'b') {
      const left = it.exp - Date.now(), wob = s * (1 + Math.sin(now * 0.004 + i) * 0.045);
      ctx.globalAlpha = left < 15000 ? 0.5 + 0.5 * Math.abs(Math.sin(now * 0.008)) : 1;

      drawImg(SPR.get('i:' + it.c + ':' + it.l), x, y, isz * s);

    ell(g, x, y + cs * 0.42, cs * 0.34, cs * 0.1); g.fillStyle = 'rgba(61,36,18,0.25)'; g.fill();
    const s = cs * 1.15;

}
const amb = [];
function drawAmbient(now, dt) {

  if (amb.length === 0 || amb.th !== th) {
    amb.length = 0; amb.th = th;
    for (let i = 0; i < 14; i++) amb.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(1.6, 3.6), ph: Math.random() * 6, v: rnd(0.6, 1.4) });
  }
  const g = ctx;
  for (const p of amb) {
    switch (th) {
      case 1: p.y -= 22 * p.v * s; p.x += Math.sin(now * 0.002 + p.ph) * 0.3; break;           // bubbles rise
      case 2: p.y += 18 * p.v * s; p.x += Math.sin(now * 0.0015 + p.ph) * 0.6; break;         // leaves fall & sway
      case 4: p.y += 26 * p.v * s; p.x += Math.sin(now * 0.001 + p.ph) * 0.4; break;          // snow
      default: p.y -= 8 * p.v * s; p.x += Math.sin(now * 0.001 + p.ph) * 0.2;                 // dust motes / sparkles
    }
    if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
    if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
    const tw = 0.5 + 0.5 * Math.sin(now * 0.003 + p.ph * 3);
    if (th === 1) { g.globalAlpha = 0.55; g.beginPath(); g.arc(p.x, p.y, p.r * 1.4, 0, Math.PI * 2); g.lineWidth = 1.2; g.strokeStyle = '#ffffff'; g.stroke(); }
    else if (th === 2) { g.globalAlpha = 0.6; g.save(); g.translate(p.x, p.y); g.rotate(Math.sin(now * 0.002 + p.ph)); g.beginPath(); g.ellipse(0, 0, p.r * 1.6, p.r * 0.8, 0, 0, Math.PI * 2); g.fillStyle = p.ph > 3 ? '#8fcf5f' : '#e9a23b'; g.fill(); g.restore(); }
    else if (th === 3) { g.globalAlpha = 0.35 + 0.6 * tw; drawImg(USPR.get('spark'), p.x, p.y, p.r * 4); }
    else if (th === 4) { g.globalAlpha = 0.9; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 1; g.strokeStyle = 'rgba(90,140,200,0.55)'; g.stroke(); }
    else { g.globalAlpha = 0.25 + 0.35 * tw; g.beginPath(); g.arc(p.x, p.y, p.r * 0.8, 0, Math.PI * 2); g.fillStyle = '#fffbe8'; g.fill(); }

function render(now, dt) {

  let ox = 0, oy = 0;
  if (shakeT) { const k = (now - shakeT) / 260; if (k >= 1) shakeT = 0; else { ox = rnd(-1, 1) * shakeAmp * (1 - k); oy = rnd(-1, 1) * shakeAmp * (1 - k); } }

/* =====================================================================
   17. MAIN LOOP
   ===================================================================== */
let lastT = performance.now(), running = false, lastSlowTick = 0;
function slowTick(now) {
  updateGift();
  const sd = shopAttention(); if (hudCache.sd !== sd) { hudCache.sd = sd; $('shopDot').classList.toggle('hidden', !sd); }
  ensureQuests();
  const qd = questsClaimable() || (questsActive() && (achClaimable() || wheelFree())); if (hudCache.qd !== qd) { hudCache.qd = qd; $('questDot').classList.toggle('hidden', !qd); }

  if (hudCache.an !== undefined && an > hudCache.an && questsActive()) { toast(t('t_ach')); Snd.play('quest'); }
  hudCache.an = an;
  popExpiredBubbles();
  if (selected >= 0 && board[selected] && board[selected].k === 'b') updateInfo();
  const dn = Date.now();
  for (const sl of slots) {
    if (sl.o && sl.o.vip && sl.state !== 'out' && dn > sl.o.vip) {
      sl.o.sad = 1; sl.state = 'out'; sl.t0 = now; sl.next = now + 1900;
      Snd.play('sad'); toast(t('t_vip_left')); recount(); saveSoon();
    }

}
function update(now) {
  tickEnergy();
  for (let s = 0; s < 3; s++) {
    const sl = slots[s];
    if (sl.state === 'out' && now >= sl.next) {
      setOrder(s, genOrder()); recount(); hintDirty = true; saveSoon();
      if (slots[s].o.vip) { Snd.play('vip'); toast(t('t_vip')); }
    }
  }

  updateHUD(now);
}
function frame(now) {
  if (!running) return;
  requestAnimationFrame(frame);
  let dt = now - lastT; lastT = now;
  if (dt > 100) dt = 100;
  if (dt < 0) dt = 16;
  update(now);
  frameNo++;
  const idle = now - lastInput > 12000 && !FX.active && !press;
  const half = idle || (G && G.eco);
  if (half && (frameNo & 1)) return;   // ~30 fps when idle or in battery saver
  render(now, half ? dt * 2 : dt);
  FX.frame(half ? dt * 2 : dt);
}
function startLoop() { if (running) return; running = true; lastT = performance.now(); requestAnimationFrame(frame); }
function stopLoop() { running = false; }

// pause reasons: 'hidden' (tab), 'sdk' (platform asked to pause)
const pauses = new Set();
let pausedAt = 0;
function pauseGame(reason) {
  const was = pauses.size > 0; pauses.add(reason);
  if (was) return;
  pausedAt = Date.now();
  saveNow(true); Snd.pause(true); stopLoop(); Platform.gameplayStop();
  if (press) cancelPress();
}
function resumeGame(reason) {
  if (!pauses.delete(reason) || pauses.size) return;
  if (!Platform.adOpen) Snd.pause(false);
  tickEnergy(); startLoop(); lastInput = performance.now();
  if (!modalOpen && !Platform.adOpen) Platform.gameplayStart();
  // came back to a backgrounded tab: welcome-back coins and the new day's gift
  if (pausedAt && G && G.tu >= TUT_DONE && !Platform.adOpen) {
    const away = Date.now() - pausedAt; pausedAt = 0;
    if (away >= OFFLINE_MIN_MS) { awayMs = away; setTimeout(showAway, 300); }
    if (dailyAvailable()) setTimeout(showDaily, 200);
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame('hidden'); else resumeGame('hidden'); });
window.addEventListener('pagehide', () => saveNow(true));
Platform.hooks.onPause = () => pauseGame('sdk');
Platform.hooks.onResume = () => resumeGame('sdk');
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 80); });
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

Platform.hooks.onAdOpen = () => { Snd.pause(true); Platform.gameplayStop(); if (press) cancelPress(); };
Platform.hooks.onAdClose = () => { if (!pauses.size) Snd.pause(false); if (!modalOpen && !pauses.size) Platform.gameplayStart(); lastInput = performance.now(); };

/* =====================================================================
   18. BOOT
   ===================================================================== */
function drawLoaderIcon() {
  const c = $('loaderIcon'), g = c.getContext('2d');
  g.drawImage(renderKey('i:bread:4', c.width), 0, 0);
}
function boot() {
